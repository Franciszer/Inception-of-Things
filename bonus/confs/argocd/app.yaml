apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wil-playground
  namespace: argocd
spec:
  project: default
  source:
    # ArgoCD reaches GitLab via Kubernetes service DNS.
    # No IP substitution needed — both live in the same cluster.
    repoURL: http://gitlab-ce.gitlab.svc.cluster.local/root/iot-config.git
    path: .
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
